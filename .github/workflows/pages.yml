name: Publicar en GitHub Pages

# Requisito único: Settings → Pages → Build and deployment → Source: «GitHub Actions».
on:
  push:
    branches: [main]
  # «Publicar ahora» del panel /back (Apps Script lanza este workflow).
  workflow_dispatch:
  # Cada noche, para que lo editado en la hoja llegue a la web aunque nadie pulse «Publicar».
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build estático
        run: pnpm build
        env:
          # Dominio propio (clubdelultimomiercoles.es): la web vive en la raíz, sin basePath.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://clubdelultimomiercoles.es' }}
          NEXT_PUBLIC_SITE_MODE: ${{ vars.SITE_MODE || 'private' }}
          # Supabase (valoraciones y login con Google). Valores públicos por diseño: la seguridad es RLS.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://voplbvbfuxgweyzarqzl.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_J5a8zk49xCPHQIxecpXwOg_i7h8M610' }}
          # Panel /back (Google Identity + Apps Script). Públicos por diseño; el secreto del cliente OAuth NO se usa.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '574225749228-umva4ec88h2kh6p40pfkj3c3mgftiqbm.apps.googleusercontent.com' }}
          NEXT_PUBLIC_APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbyfbsfLUx-R6XFSXE29T4SYJp59JM6zSk9ezIC8SLs6p3Wp1W0dU8jmf51SAZO2WE_bOw/exec' }}
          # Lecturas desde la hoja «CMS Club» (pnpm sync). Datos no válidos: no se publica nada.
          # Script sin implementar o sin acceso: aviso y se publica con el CSV de respaldo.
          SYNC_HOJA: ${{ vars.SYNC_HOJA || '1' }}
          # Settings → Secrets and variables → Actions → New repository secret
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
